name: Daily Xueqiu watchlist snapshot

on:
  schedule:
    # 18:15 Asia/Shanghai (UTC+8) every day; scheduled starts may be delayed.
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-xueqiu-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XUEQIU_USER_ID: '9430706524'
      XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validation tests
        run: node --test tests/update-xueqiu.test.mjs

      - name: Fetch and validate Xueqiu watchlist
        run: node scripts/update-xueqiu.mjs

      - name: Commit updated public snapshot data
        run: |
          git add public/data/auto-snapshots.json
          if git diff --cached --quiet; then
            echo 'No snapshot change; skipping commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: update daily Xueqiu watchlist snapshot'
          git push origin HEAD:main
